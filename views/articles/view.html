<style>
    .article-card {
        max-width: 900px;
        margin: 3em auto;
        background: #1f1f1f;
        border: 1px solid #2e2e2e;
        border-radius: 16px;
        padding: 32px;
        color: #eaeaea;
        font-family: var(--gilroy, Arial, sans-serif);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .article-card h1 {
        color: #fff;
        font-size: 2.2rem;
        margin: 0 0 12px;
    }

    .article-card .meta {
        display: flex;
        gap: 20px;
        color: #9a9a9a;
        font-size: 0.95rem;
        margin-bottom: 24px;
        padding-bottom: 16px;
        border-bottom: 1px solid #2e2e2e;
    }

    .article-card .meta strong {
        color: #EAC65E;
    }

    .article-card img {
        max-width: 100%;
        border-radius: 10px;
        margin: 16px 0;
    }

    .article-card .body {
        font-size: 1.05rem;
        line-height: 1.7;
        white-space: pre-wrap;
        word-break: break-word;
    }

    .article-card .back {
        display: inline-block;
        margin-top: 24px;
        padding: 10px 20px;
        background: #A80C0C;
        color: #fff;
        border-radius: 8px;
        text-decoration: none;
        transition: background 0.2s;
    }

    .article-card .back:hover {
        background: #d41a1a;
    }

    .article-card .error {
        color: #ffb3b3;
        background: #4a1f1f;
        border: 1px solid #a33;
        padding: 12px 16px;
        border-radius: 8px;
    }

    .article-card .spinner {
        color: #9a9a9a;
    }
</style>

<div class="article-card" id="article">
    <p class="spinner">Загрузка статьи…</p>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const box = document.getElementById('article');

        const id = location.pathname.match(/\/article\/(\d+)/)?.[1];
        if (!id) {
            box.innerHTML = '<div class="error">Неверный URL статьи</div>';
            return;
        }

        fetch(`/api/article/${id}`)
            .then(r => r.json().then(data => ({ ok: r.ok, status: r.status, data })))
            .then(({ ok, status, data }) => {
                if (!ok) throw new Error(data.error || ('HTTP ' + status));
                const a = data.article;

                const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({
                    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
                })[c]);

                box.innerHTML = `
                    <h1>${esc(a.name)}</h1>
                    <div class="meta">
                        <span>Автор: <strong>${esc(a.author_nickname ?? a.author_id)}</strong></span>
                        <span>ID: <strong>${esc(a.id)}</strong></span>
                        ${a.created_at ? `<span>Дата: <strong>${esc(a.created_at)}</strong></span>` : ''}
                    </div>
                    ${a.img ? `<img src="/${esc(a.img)}" alt="${esc(a.name)}">` : ''}
                    <div class="body">${esc(a.text)}</div>
                    <a class="back" href="/articles">← Все статьи</a>
                `;
            })
            .catch(err => {
                box.innerHTML = '<div class="error">Ошибка: ' + escText(err.message) + '</div>';
            });
    });

    function escText(s) {
        return String(s ?? '').replace(/[&<>"']/g, c => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        })[c]);
    }
</script>
